name: XAU ELITE FX — Daily Cycles (cloud, PC can stay off)

# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║  RUNS ON GITHUB'S SERVERS — YOUR COMPUTER DOES NOT NEED TO BE ON.        ║
# ║                                                                           ║
# ║  Times below are UTC. Casablanca is UTC+1 (Morocco standard time):        ║
# ║    • 22:00 UTC (23:00 Casablanca, winter) / 21:00 UTC (22:00 summer)      ║
# ║      Daily candle close -> FULL DESK (lessons + AI Daily Bias +           ║
# ║      AI Setups/Sniper + every page dataset + AI Fundamental Verdict +     ║
# ║      all-8-TF charts + BIAS-V2 -> Surge deploy -> live verify)            ║
# ║                                                                           ║
# ║  You can also run any cycle ON DEMAND from the "Actions" tab →            ║
# ║  "Run workflow" button (works from your phone browser too).               ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

on:
  schedule:
    # Dense around-the-clock schedule so GitHub cron jitter never leaves the desk stale.
    # Every scheduled run goes through desk_fresh.py first:
    #   • if today's closed bar is ALREADY published on the live site → exits in ~10s, $0 spent
    #   • if the live site is BEHIND the last closed bar → runs the full D+1 AI chain once.
    - cron: '5 21 * * *'
    - cron: '15 21 * * *'
    - cron: '40 21 * * *'
    - cron: '5 22 * * *'
    - cron: '15 22 * * *'
    - cron: '30 22 * * *'
    - cron: '55 22 * * *'
    - cron: '20 23 * * *'
    - cron: '40 23 * * *'
    - cron: '20 0 * * *'
    - cron: '20 1 * * *'
    - cron: '40 2 * * *'
    - cron: '20 4 * * *'
    - cron: '20 5 * * *'
    - cron: '20 7 * * *'
    - cron: '20 9 * * *'
    - cron: '0 12 * * *'
    - cron: '0 16 * * *'
    - cron: '0 20 * * *'

  workflow_dispatch:
    inputs:
      cycle:
        description: 'Which cycle to run right now'
        required: true
        default: 'daily-bias'
        type: choice
        options:
          - daily-bias
          - bias-only
          - sniper-refresh
          - position-check
          - miss-review
          - deploy-only
      rebuild:
        description: "Force a rebuild even while today's candle is still open (re-anchors on the last closed bar)?"
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
          - 'if-behind'
      setup:
        description: '[position-check only] A or B'
        required: false
        default: ''
      entry:
        description: '[position-check only] actual fill price (e.g. 4458.50)'
        required: false
        default: ''
      sl:
        description: '[position-check only] active stop loss'
        required: false
        default: ''
      tp:
        description: '[position-check only] active take profit'
        required: false
        default: ''
      filled:
        description: '[position-check only] fill time HH:MM'
        required: false
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: xef-deploy
  cancel-in-progress: false

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: callmeforex/xau-elite-fx
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      - name: Map /home/user to the repo (zero script-path changes)
        run: |
          sudo ln -sfn "$GITHUB_WORKSPACE" /home/user
          echo "repo mounted at /home/user:" && ls /home/user | head -6

      - name: Install refresh dependencies
        run: |
          python3 -m pip install --quiet --disable-pip-version-check -r requirements.txt
          python3 -c "import websocket; print('websocket-client', websocket.__version__)"

      - name: Decide which cycle to run (and skip when today's desk is already built)
        id: gate
        timeout-minutes: 5
        run: |
          CYCLE="${{ inputs.cycle }}"
          REBUILD="${{ inputs.rebuild }}"
          if [ "${{ github.event_name }}" != "schedule" ] && [ "$REBUILD" != "if-behind" ]; then
            [ -z "$CYCLE" ] && CYCLE="daily-bias"
            echo "manual dispatch → cycle=$CYCLE rebuild=$REBUILD (freshness gate bypassed)"
            echo "CYCLE=$CYCLE" >> "$GITHUB_ENV"
            echo "SKIP=0"       >> "$GITHUB_ENV"
            exit 0
          fi

          echo "now UTC : $(date -u '+%Y-%m-%d %H:%M')"
          echo "now CST : $(TZ=Africa/Casablanca date '+%Y-%m-%d %H:%M %Z (%z)')"
          case "${{ github.event.schedule }}" in
            "5 21 * * *"|"15 21 * * *"|"40 21 * * *"|"5 22 * * *"|"15 22 * * *"|"30 22 * * *"|"55 22 * * *"|"20 23 * * *"|"40 23 * * *"|"20 0 * * *"|"20 1 * * *"|"40 2 * * *"|"20 4 * * *"|"20 5 * * *"|"20 7 * * *"|"20 9 * * *"|"0 12 * * *"|"0 16 * * *"|"0 20 * * *"|"0 21 * * *"|"0 22 * * *"|"0 21 * * 1-5"|"0 22 * * 1-5"|*)
              if [ "$(TZ=Africa/Casablanca date '+%u')" = "6" ]; then
                echo "::notice::Saturday in Casablanca — market closed, Friday's run already locked the next session."
                echo "SKIP=1" >> "$GITHUB_ENV"
                exit 0
              fi
              # Refresh gold's 1D + 1H bars from TradingView first (~5 s) so the gate
              # evaluates the live market close, not a stale checkout file.
              python3 -c "import sys; sys.path.insert(0,'/home/user'); from refresh import charts; charts.run(scope='gold')" \
                || echo "::warning::gold bar pre-check failed — desk_fresh will use the live site's copy"
              set +e
              OUT=$(python3 /home/user/desk_fresh.py)
              RC=$?
              set -e
              echo "desk freshness (live): $OUT (exit $RC)"
              if [ "$RC" -eq 0 ]; then
                set +e
                OUT_LOCAL=$(python3 - <<'PY'
          import json, sys
          sys.path.insert(0, '/home/user')
          import desk_fresh as DF
          from refresh import common as C
          host = "https://xau-elite-fx.surge.sh"
          card = DF.get(host, "/bias/XAUUSD.json")
          bars = json.load(open("/home/user/xau-elite-fonda/public/chartdata/chart-XAUUSD-1D.json"))["data"]["bars"]
          m = json.load(open("/home/user/xau-elite-fonda/public/chartdata/chart-XAUUSD-1H.json"))["data"]
          h1 = m["bars"]
          closed = DF.last_closed_label(bars, h1, C.fetched_ts(m))
          have = card.get("barAsOf")
          locked = card.get("lockedForDate")
          want = C.next_session(closed, card.get("assetClass")) if closed else None
          if (closed and have != closed) or (want and locked and locked != want):
              print(f"BEHIND_LOCAL have={have} closed={closed} locked={locked} want={want}")
              sys.exit(1)
          print(f"FRESH_LOCAL have={have} closed={closed} locked={locked}")
          sys.exit(0)
          PY
                )
                RC_LOCAL=$?
                set -e
                echo "desk freshness (vs fresh TV bars): $OUT_LOCAL (exit $RC_LOCAL)"
                [ "$RC_LOCAL" -ne 0 ] && RC=1
              fi
              if [ "$RC" -eq 0 ]; then
                echo "::notice::the desk is already on the last closed candle — nothing to build, nothing to spend."
                echo "SKIP=1" >> "$GITHUB_ENV"
              else
                echo "::notice::the desk is BEHIND the last closed candle — running the full AI desk now."
                echo "CYCLE=daily-bias" >> "$GITHUB_ENV"
                echo "SKIP=0"           >> "$GITHUB_ENV"
              fi ;;
          esac

      - name: Unpack archives (first run only — later runs use committed trees)
        if: env.SKIP != '1'
        run: |
          cd /home/user
          for z in sites.zip chartdata-master.zip day-folder.zip bt.zip; do
            if [ -f "$z" ]; then unzip -q "$z" && rm -f "$z" && echo "unpacked $z"; fi
          done
          echo "repo now contains:" && ls /home/user | head -10

      - name: Unit checks (freshness gate + the bias badge's meaning)
        if: env.SKIP != '1'
        run: |
          python3 "$GITHUB_WORKSPACE/test-desk-fresh.py"
          python3 "$GITHUB_WORKSPACE/test-provisional.py"
          python3 "$GITHUB_WORKSPACE/test-inputs.py"
          python3 "$GITHUB_WORKSPACE/test-autorun.py"

      - name: Restore the live LEDGER only (keep the repo's rule set)
        if: env.SKIP != '1'
        run: |
          python3 /home/user/restore-ledger.py

      - name: Snapshot artefact hashes (pre-run baseline)
        if: env.SKIP != '1'
        run: |
          mkdir -p /tmp/xefpre && rm -f /tmp/xefpre/*.sha
          for f in daily-bias-locked.js setups-preloaded.js fundamental-verdicts.json cot-5yr-all.js macro-history.json bias-all.json bias/XAUUSD.json sniper/index.json sniper/XAUUSD.json; do
            for build in xau-elite-fonda xau-elite-fonda2; do
              p="/home/user/$build/public/$f"
              k=$(printf '%s' "$f" | tr '/' '-')
              [ -f "$p" ] && sha256sum "$p" >> "/tmp/xefpre/$build-$k.sha"
            done
          done
          echo "baseline hashes captured: $(ls /tmp/xefpre | wc -l) files"

      - name: Run the cycle (real model call on the CI_KEY / ASHNA_KEY secret)
        if: env.SKIP != '1'
        timeout-minutes: 60
        env:
          ASHNA_KEY: ${{ secrets.ASHNA_KEY }}
          ASHNA_MODEL: beam-free
          BIAS_MODEL: beam-free
          CI_KEY: ${{ secrets.CI_KEY }}
          GOLD_MODEL: beam-free
          PAIR_MODEL: beam-free
          GOLD_EFFORT: low
          PAIR_EFFORT: low
          BIAS_WORKERS: '6'
          TD_KEY: ${{ secrets.TD_KEY }}
          LSE_API_KEY: ${{ secrets.LSE_API_KEY || secrets.LSE }}
          OM_MCP_TOKEN: ${{ secrets.OM_MCP_TOKEN }}
          OM_MCP_TOKEN_2: ${{ secrets.OM_MCP_TOKEN_2 }}
          XEF_FORCE_REBUILD: ${{ (inputs.rebuild == 'true' || inputs.rebuild == 'yes') && '1' || '0' }}
        run: |
          cd /home/user
          echo "cycle resolved: $CYCLE (trigger: ${{ github.event_name }} ${{ github.event.schedule }})"
          case "$CYCLE" in
            position-check)
              if [ -z "${{ inputs.setup }}" ] || [ -z "${{ inputs.entry }}" ] || [ -z "${{ inputs.sl }}" ] || [ -z "${{ inputs.tp }}" ]; then
                echo "::error::position-check needs YOUR fill — fill the setup / entry / sl / tp fields in the Run-workflow form"
                exit 1
              fi
              FILLED=""
              [ -n "${{ inputs.filled }}" ] && FILLED="--filled ${{ inputs.filled }}"
              python3 fetch-position.py
              python3 build-position-request.py --setup "${{ inputs.setup }}" --entry "${{ inputs.entry }}" --sl "${{ inputs.sl }}" --tp "${{ inputs.tp }}" $FILLED
              python3 call-position-check.py
              python3 publish-position-check.py
              ;;
            sniper-refresh)
              python3 fetch-refresh.py
              python3 om-oi-grade.py || echo "::warning::OI shadow grading skipped (non-fatal)"
              python3 om-oi-shadow.py || echo "::warning::OI shadow fetch skipped (non-fatal)"
              python3 build-sniper-request.py
              ASHNA_MODEL=gpt-6.1-sol python3 call-omni-sniper.py
              if ! python3 publish-sniper.py; then
                echo "::warning::sniper validation rejected the response - ONE corrective retry (the exact failures are fed back to the model)"
                if ! { python3 build-sniper-request.py && ASHNA_MODEL=gpt-6.1-sol python3 call-omni-sniper.py && python3 publish-sniper.py; }; then
                  echo "::error::sniper-refresh published NOTHING - the previous payload is still live. Re-run the cycle."
                  exit 1
                fi
              fi
              python3 execution-sheet.py || echo "::warning::execution sheet skipped (non-fatal)"
              ;;
            daily-bias)
              echo "::notice::FULL CHAIN — bias, setups, every page dataset, then deploy"
              bash /home/user/run-full-chain.sh
              ;;
            bias-only)
              echo "::notice::bias-only — the AI Daily Bias card and nothing else"
              CLOSED=$(python3 check-fresh-lessons.py --resolve-only || echo "unknown")
              echo "last closed candle: $CLOSED (review-only, no rule is added)"
              python3 fetch-bias.py
              python3 om-oi-grade.py || echo "::warning::OI shadow grading skipped (non-fatal)"
              python3 om-oi-shadow.py || echo "::warning::OI shadow fetch skipped (non-fatal)"
              python3 build-bias-request.py
              BIAS_MODEL=gpt-6.1-sol python3 call-bias.py
              python3 publish-bias.py || {
                echo "::warning::publish gates rejected the forecast - ONE corrective retry"
                python3 build-bias-request.py && python3 call-bias.py && python3 publish-bias.py
              }
              ;;
            miss-review)
              CLOSED=$(python3 check-fresh-lessons.py --resolve-only)
              echo "miss-review (forensic only, NO rule append) for $CLOSED"
              python3 fetch-miss-review.py --date "$CLOSED" || echo "::warning::fetch failed (non-fatal)"
              ;;
            deploy-only)
              echo "deploy-only: no AI run — deploying the current repo state to both sites"
              ;;
          esac

      - name: Refresh every page dataset (COT, seasonality, verdicts, curves, 8-TF gold bars)
        if: env.SKIP != '1'
        timeout-minutes: 30
        env:
          ASHNA_KEY: ${{ secrets.ASHNA_KEY }}
          CI_KEY: ${{ secrets.CI_KEY }}
          ASHNA_MODEL: gpt-6.1-sol
          FONDA_EFFORT: high
          XEF_CHART_ALL: ${{ (env.CYCLE == 'daily-bias' || github.event_name == 'schedule') && '1' || '' }}
        run: |
          if [ "$CYCLE" = "daily-bias" ] && [ -f /home/user/xau-elite-fonda/public/data-freshness.json ]; then
            echo "daily-bias already refreshed every page dataset inside run-full-chain.sh — skipping duplicate pass"
          else
            python3 /home/user/refresh-page-data.py --allow-partial || echo "::warning::page refresh had failures (see log)"
          fi

      - name: BIAS-V2 — standalone daily bias + setups page
        if: env.SKIP != '1'
        env:
          TD_KEY: ${{ secrets.TD_KEY }}
        run: bash /home/user/bias-v2/run.sh || echo "::warning::bias-v2 refresh failed — previous page stays live"

      - name: Deploy both sites to Surge
        if: env.SKIP != '1'
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: bash /home/user/deploy-sites.sh

      - name: Verify live after deploy (the desk customers read must be this session's)
        if: env.SKIP != '1'
        run: |
          sleep 5
          for h in https://xau-elite-fx.surge.sh https://xau-elite-fx2.surge.sh; do
            curl -fsS -o /dev/null -w "$h /home : %{http_code}\n" "$h/"
            curl -fsS -o /dev/null -w "$h chartdata : %{http_code}\n" "$h/chartdata/chart-XAUUSD-1D.json"
            python3 /home/user/desk_fresh.py --host "$h" || {
              echo "::error::$h is not serving a desk anchored on the last closed candle"; exit 1; }
          done
          python3 - <<'EOF'
          import json, urllib.request, datetime, sys
          now = datetime.datetime.now(datetime.timezone.utc)
          bad = 0
          for host in ("https://xau-elite-fx.surge.sh", "https://xau-elite-fx2.surge.sh"):
              for path in ("/bias-all.json", "/sniper/index.json"):
                  try:
                      raw = urllib.request.urlopen(host + path + "?cb=" + str(now.timestamp()), timeout=30).read()
                      g = json.loads(raw).get("generatedAt")
                      age = (now - datetime.datetime.fromisoformat(str(g).replace("Z", "+00:00"))).total_seconds() / 3600.0
                      if age <= 14:
                          print("OK   %s%s - generatedAt %s (%.1f h)" % (host, path, g, age))
                      else:
                          print("::error::%s%s - generatedAt %s (%.1f h) IS NOT THIS SESSION'S" % (host, path, g, age))
                          bad += 1
                  except Exception as e:
                      print("::error::%s%s unreachable (%s)" % (host, path, e)); bad += 1
          print("live desk check: %d problem(s)" % bad)
          sys.exit(1 if bad else 0)
          EOF

      - name: Report the full chain (and fail the run if a page did not refresh)
        if: always() && env.SKIP != '1'
        run: |
          echo "──────── AI stage ledger ────────"
          if [ -f /tmp/xef-cycle-status.tsv ]; then
            printf '%-4s %-44s %-8s %s\n' ID STAGE STATUS TIME
            awk -F'\t' '{printf "%-4s %-44s %-8s %ss %s\n", $1, $2, $3, $4, $5}' /tmp/xef-cycle-status.tsv
          else
            echo "(no ledger — the chain script did not run for this cycle)"
          fi

          echo "──────── published artefacts written by this run ────────"
          BAD=0
          if [ "$CYCLE" = "deploy-only" ]; then
            echo "  note  cycle=deploy-only — freshness gated on presence, not on change"
            CYCLE_IS_DEPLOY_ONLY=1
          else
            CYCLE_IS_DEPLOY_ONLY=0
          fi
          case "$CYCLE" in
            bias-only)       MUST_CHANGE="daily-bias-locked.js" ;;
            sniper-refresh)  MUST_CHANGE="setups-preloaded.js" ;;
            position-check)  MUST_CHANGE="position-check-latest.json" ;;
            miss-review)     MUST_CHANGE="" ;;
            *)               MUST_CHANGE="fundamental-verdicts.json cot-5yr-all.js bias-all.json bias/XAUUSD.json sniper/index.json sniper/XAUUSD.json" ;;
          esac
          for f in bias-all.json bias/XAUUSD.json sniper/index.json sniper/XAUUSD.json daily-bias-locked.js setups-preloaded.js fundamental-verdicts.json cot-5yr-all.js macro-history.json; do
            p="/home/user/xau-elite-fonda/public/$f"
            k=$(printf '%s' "$f" | tr '/' '-')
            base="/tmp/xefpre/xau-elite-fonda-$k.sha"
            if [ ! -f "$p" ]; then
              echo "::error::MISSING $f"
              BAD=1
            elif [ "$CYCLE_IS_DEPLOY_ONLY" = "1" ]; then
              printf '  OK    %-32s (%d bytes, deploy-only)\n' "$f" "$(wc -c < "$p")"
            elif [ -f "$base" ] && sha256sum --status -c "$base" 2>/dev/null; then
              case " $MUST_CHANGE " in
                *" $f "*)
                  echo "::error::UNCHANGED $f — still identical to the pre-run checkout (stage did not publish)"
                  BAD=1 ;;
                *)
                  printf '  keep  %-32s (not targeted by %s)\n' "$f" "$CYCLE" ;;
              esac
            else
              printf '  FRESH %-32s (%d bytes, written by this run)\n' "$f" "$(wc -c < "$p")"
            fi
          done

          if [ "$CYCLE" = "daily-bias" ] || [ -z "$CYCLE" ]; then
            echo "──────── per-instrument AI output (must come from THIS session) ────────"
            python3 - <<'EOF' || BAD=1
          import json, datetime, os
          now = datetime.datetime.now(datetime.timezone.utc)
          bad = 0
          for label, rel, key in [
              ("34-pair daily bias (bias-all.json)", "bias-all.json", "generatedAt"),
              ("XAUUSD bias card  (bias/XAUUSD.json)", "bias/XAUUSD.json", "generatedAt"),
              ("34-pair setups    (sniper/index.json)", "sniper/index.json", "generatedAt"),
              ("XAUUSD setups     (sniper/XAUUSD.json)", "sniper/XAUUSD.json", "generatedAt"),
          ]:
              p = "/home/user/xau-elite-fonda/public/" + rel
              if not os.path.exists(p):
                  print("::error::MISSING %s" % label); bad = 1; continue
              d = json.load(open(p))
              g = d.get(key) or ""
              if not g:
                  print("::error::%s — no %s, cannot prove it is this session's" % (label, key)); bad = 1; continue
              age = (now - datetime.datetime.fromisoformat(g.replace("Z", "+00:00"))).total_seconds() / 3600.0
              ok = age <= 14
              print("%s%s — %s (%.1f h old)%s" % ("  OK   " if ok else "::error::", label, g, age,
                                                  "" if ok else "  <-- NOT THIS SESSION'S"))
              bad += 0 if ok else 1
          try:
              card = json.load(open("/home/user/xau-elite-fonda/public/bias/XAUUSD.json"))
              bars = json.load(open("/home/user/xau-elite-fonda/public/chartdata/chart-XAUUSD-1D.json"))["data"]["bars"]
              import sys
              sys.path.insert(0, "/home/user")
              from refresh import common as _C
              try:
                  _m = json.load(open("/home/user/xau-elite-fonda/public/chartdata/chart-XAUUSD-1H.json"))["data"]
                  _h1 = _m["bars"]
                  _h1_ts = _C.fetched_ts(_m)
              except Exception:
                  _h1, _h1_ts = [], None
              _closed, _info = _C.drop_open_bars(bars, "1D", market_idle=_C.market_idle(_h1),
                                                 intraday_tail=_h1, tail_fetched_at=_h1_ts)
              closed = _closed[-1].get("date") if _closed else None
              want_locked = _C.next_session(closed, card.get("assetClass")) if closed else None
              if closed and card.get("barAsOf") != closed:
                  print("::error::the desk is anchored on %s but the last CLOSED candle is %s"
                        % (card.get("barAsOf"), closed)); bad = 1
              elif want_locked and card.get("lockedForDate") and card.get("lockedForDate") != want_locked:
                  print("::error::the desk lockedForDate is %s but next session is %s"
                        % (card.get("lockedForDate"), want_locked)); bad = 1
              else:
                  print("  OK   desk anchored on the last closed candle (%s -> locked %s)"
                        % (card.get("barAsOf"), card.get("lockedForDate")))
          except Exception as e:
              print("::error::could not verify the anchor (%s)" % e); bad = 1
          raise SystemExit(bad)
          EOF
          fi
          python3 /home/user/desk_fresh.py --host file:///home/user/xau-elite-fonda/public --max-age 14 || BAD=1
          python3 /home/user/report-chain.py || BAD=1
          exit $BAD

      - name: Commit updated data back to the repo (keeps history + next run's ledger)
        if: env.SKIP != '1'
        run: |
          cd /home/user
          git config user.name  "xef-cycle-bot"
          git config user.email "xef-cycle-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing new to commit"
          else
            git commit -m "cycle: ${CYCLE:-daily-bias} $(date -u '+%Y-%m-%d %H:%M UTC')"
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin main && git push origin main && break
              echo "push collided with another commit (attempt $attempt) — rebasing"
              sleep 3
            done
          fi
