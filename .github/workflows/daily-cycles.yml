name: XEF Daily Cycles

on:
  workflow_dispatch:
    inputs:
      cycle:
        description: "daily-bias = FULL DESK (bias + setups + every page + deploy). bias-only = bias only."
        required: true
        default: "daily-bias"
        type: choice
        options:
          - daily-bias
          - sniper-refresh
          - bias-only
          - position-check
          - miss-review
          - deploy-only
      setup:
        description: "POSITION-CHECK only: setup id of your executed trade (e.g. rf0054)"
        required: false
        default: ""
      entry:
        description: "POSITION-CHECK only: your fill entry price (e.g. 4137.5)"
        required: false
        default: ""
      sl:
        description: "POSITION-CHECK only: your stop loss (e.g. 4128.0)"
        required: false
        default: ""
      tp:
        description: "POSITION-CHECK only: your take profit (e.g. 4160.0)"
        required: false
        default: ""
      rebuild:
        description: "daily-bias/sniper-refresh: rebuild on the last CLOSED candle even if the desk is already on it (use after a code fix to the cards)"
        required: false
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"
      filled:
        description: "POSITION-CHECK only (optional): executed volume (e.g. 0.10)"
        required: false
        default: ""

  # ── SCHEDULE (enabled 2026-11-02) ──────────────────────────────────────────────
  # Times are UTC; Casablanca = UTC+1.
  # WHY THIS WAS ENABLED: the schedule block had been commented out, so NOTHING ever
  # ran on a timer. On 2 Nov the live bias card still carried the 2 Nov forecast built
  # from the 30 Oct candle while the market was trading 3970 — the site simply "missed
  # the bias for today" because no cycle fired. Manual dispatch was the only path.
  schedule:
    - cron: "20 0 * * 2-6"   # 01:20 Casablanca — LESSONS for the just-closed session.
                             # The daily candle closes at 00:00 UTC, so 00:20 is the first
                             # honest moment to grade it. Runs first so the evening bias
                             # consumes that day's lesson.
    - cron: "0 12 * * 2-6"   # 13:00 Casablanca — position check
    # ── 2026-11-16 (R39): the owner's daily run is 22:00 MOROCCO time ────────────
    # Morocco keeps UTC+1 all year EXCEPT Ramadan, when it drops to UTC+0. A cron
    # cannot know that, so both possible UTC hours are listed and the job itself
    # decides: the "22:00 Casablanca gate" step below lets the run proceed ONLY if
    # Africa/Casablanca is really 22:xx. Whichever cron is the wrong one exits in
    # seconds and costs nothing. That is why there are two lines and not one.
    #
    # Every day, not Mon-Fri: Sunday 22:00 Casablanca is inside the new week's session
    # (Asia opens Sunday evening), so it is the right moment to lock Monday. Saturday is
    # the only day with no market, and the gate below skips it by name instead of paying
    # for 68 model calls that would reproduce Friday night's answer.
    # ── 2026-11-19 (R99): THE 22:00 GATE COULD NEVER PASS. PROOF AND FIX. ───────
    # These two lines fired at 21:00Z and 22:00Z, and the gate step demanded that
    # Africa/Casablanca be 22:xx. Morocco is UTC+1 outside Ramadan, so the 21:00Z run
    # ARRIVES at 22:00 local — the gate printed "now: 21:00 +00 (+0000)", read hour 21,
    # called itself "the wrong cron for today's UTC offset" and set XEF_NOOP=1. The
    # 22:00Z run arrives at 23:00 local and was rejected too. Every day, both crons.
    # The job still reported SUCCESS because XEF_NOOP skips every step — that is how the
    # desk sat on 2026-11-16 for three days while every scheduled run looked green.
    #
    # There is now ONE daily cron, late enough that the daily candle has closed in both
    # Morocco offsets (UTC+1 and Ramadan's UTC+0), plus two morning catch-up runs. The
    # gate no longer does clock arithmetic — see the freshness gate below.
    - cron: "30 22 * * *"  # 23:30 Casablanca at UTC+1 · 22:30 at UTC+0 — after the close
    - cron: "20 5 * * *"   # 06:20 Casablanca — catch-up if the night run failed
    - cron: "20 9 * * *"   # 10:20 Casablanca — second catch-up, before London's afternoon
    # ── R103: THE NIGHT MUST BE ABLE TO RETRY ITSELF ───────────────────────────
    # One daily cron plus two morning catch-ups left a hole: if the 22:30 pass died for a
    # reason nobody was watching (an Actions incident, an account limit, or the credits
    # guard below refusing to spend), the next attempt was 06:20 — so customers read the
    # previous session all day and nothing said so until someone looked.
    # 23:40Z is a second chance the same evening, comfortably after the 22:00-23:00Z
    # rollover break; 02:40Z is a quiet hour to retry anything still wrong. Both pass the
    # same freshness gate first, so on a night that already worked they exit in seconds
    # and spend nothing.
    - cron: "40 23 * * *"  # 00:40 Casablanca — retry the same evening
    - cron: "40 2 * * *"   # 03:40 Casablanca — last unattended chance before morning

# Two workflows write the same artefacts (this one and the 3-hourly page refresh).
# Running them at the same minute is what makes "the index lost instruments" bugs:
# one run's partial tree gets deployed while the other is still writing. They now
# take the same lock, and the second one waits.
concurrency:
  group: xef-desk
  cancel-in-progress: false

permissions:
  contents: write        # lets the run commit updated state back to the repo

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          repository: callmeforex/xau-elite-fx
          token: ${{ secrets.GH_PAT }}

      - name: Is today's desk built? (gate — one build per session, catch-up when behind)
        # R99. This step is why the bias and the setups were not daily: it compared the
        # LOCAL hour to 22 and no cron ever produced that hour (see the cron comment).
        # It now asks the owner's question — has the desk been built on the candle that
        # most recently CLOSED? — and reads the DEPLOYED site, not the checkout.
        #   FRESH  -> nothing to do; exits in seconds, spends nothing
        #   BEHIND -> run the whole AI desk, anchored on the last CLOSED bar
        # A day already built cannot be built twice; a missed day is repaired by the next
        # run instead of waiting another 24 h. Saturday is a real no-op.
        # Manual dispatch always runs.
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "manual dispatch — the freshness gate does not apply, running the requested cycle"
            exit 0
          fi
          echo "now UTC : $(date -u '+%Y-%m-%d %H:%M')"
          echo "now CST : $(TZ=Africa/Casablanca date '+%Y-%m-%d %H:%M %Z (%z)')"
          case "${{ github.event.schedule }}" in
            "30 22 * * *"|"20 5 * * *"|"20 9 * * *"|"40 23 * * *"|"40 2 * * *")
              if [ "$(TZ=Africa/Casablanca date '+%u')" = "6" ]; then
                echo "::notice::Saturday in Casablanca — market closed, Friday's run already locked the next session."
                echo "XEF_NOOP=1" >> "$GITHUB_ENV"
                exit 0
              fi
              # NOTE: the /home/user symlink is created AFTER this step, so the script must
              # be addressed through the checkout itself. Missing or broken script -> BEHIND
              # (the safe direction: a needless run costs tokens, a skipped run costs a day).
              set +e
              OUT=$(python3 "$GITHUB_WORKSPACE/desk_fresh.py")
              RC=$?
              set -e
              echo "desk freshness: $OUT"
              if [ "$RC" -eq 0 ]; then
                echo "::notice::the desk is already on the last closed candle — nothing to build, nothing to spend."
                echo "XEF_NOOP=1" >> "$GITHUB_ENV"
              else
                echo "::notice::the desk is BEHIND the last closed candle — running the full AI desk now (anchored on the CLOSED bar, never the live one)."
              fi ;;
            *) : ;;   # 01:20 lessons review and 13:00 position-check resolve their own cycle
          esac

      - name: Map /home/user to the repo (zero script-path changes)
        run: |
          sudo ln -s "$GITHUB_WORKSPACE" /home/user
          echo "repo mounted at /home/user:" && ls /home/user | head -6

      - name: Unpack archives (first run only — later runs use committed trees)
        if: env.XEF_NOOP != '1'
        run: |
          cd /home/user
          for z in sites.zip chartdata-master.zip day-folder.zip bt.zip; do
            if [ -f "$z" ]; then unzip -q "$z" && rm -f "$z" && echo "unpacked $z"; fi
          done
          echo "repo now contains:" && ls /home/user | head -10

      - name: Unit checks (freshness gate + the bias badge's meaning)
        if: env.XEF_NOOP != '1'
        # R100. Both of these exist because a run that "looked fine" shipped something
        # wrong: a gate that could never pass, and a badge that called a final bias
        # provisional. They are cheap (a second) and they stop that class of bug reaching
        # customers again.
        run: |
          python3 "$GITHUB_WORKSPACE/test-desk-fresh.py"
          python3 "$GITHUB_WORKSPACE/test-provisional.py"
          python3 "$GITHUB_WORKSPACE/test-inputs.py"
          # R103: can the desk refresh itself tomorrow with nobody watching? The contract
          # (schedule present, every cron routed to the desk, the readiness gate, the
          # ceilings) is checked here, before any paid call, because every outage on this
          # desk so far was a wiring break that each individual file looked fine about.
          python3 "$GITHUB_WORKSPACE/test-autorun.py"

      - name: Install refresh dependencies
        if: env.XEF_NOOP != '1'
        # refresh/tvdata.py needs websocket-client for the TradingView chart feed. It was
        # missing from the runner, and because charts.py was imported at module level the
        # ModuleNotFoundError took down the WHOLE page-dataset stage — COT, seasonality,
        # macro and the AI verdicts were never refreshed in CI at all. That is the actual
        # reason the COT page sat on an old report and the fundamental page drifted back to
        # a 2026-11-01 vintage, while the log only ever said "page refresh had failures".
        run: |
          python3 -m pip install --quiet --disable-pip-version-check -r requirements.txt
          python3 -c "import websocket; print('websocket-client', websocket.__version__)"

      - name: Restore the live LEDGER only (keep the repo's rule set)
        if: env.XEF_NOOP != '1'
        run: |
          # v1 ROLLBACK (2026-11-04): this used to copy the whole live learning-state over the repo,
          # which silently reverted the protocol rollback on every run (the 29-rule file came back
          # and the deploy guard then blocked the v1 file). DATA comes from live; RULES come from the
          # repo. Freshness is preserved; the protocol stays v1.
          python3 /home/user/restore-ledger.py

      - name: Snapshot artefact hashes (pre-run baseline)
        if: env.XEF_NOOP != '1'
        # A fresh checkout stamps EVERY file with the checkout time, so file mtime cannot
        # tell "written by this run" from "just arrived from git". (That is exactly how the
        # first version of this check passed a run in which the bias and the sniper had both
        # failed their input gates.) The comparison is by content hash instead.
        run: |
          mkdir -p /tmp/xefpre && rm -f /tmp/xefpre/*.sha
          for f in daily-bias-locked.js setups-preloaded.js fundamental-verdicts.json cot-5yr-all.js macro-history.json bias-all.json bias/XAUUSD.json sniper/index.json sniper/XAUUSD.json; do
            for build in xau-elite-fonda xau-elite-fonda2; do
              p="/home/user/$build/public/$f"
              # R39: the list now includes nested paths (bias/XAUUSD.json, sniper/index.json),
              # so the hash file name must flatten the slashes or the step dies on a
              # missing directory — which is what it did on the first run of this change.
              k=$(printf '%s' "$f" | tr '/' '-')
              [ -f "$p" ] && sha256sum "$p" >> "/tmp/xefpre/$build-$k.sha"
            done
          done
          echo "baseline hashes captured: $(ls /tmp/xefpre | wc -l) files"

      - name: Run the cycle (real model call on the ASHNA_KEY secret)
        if: env.XEF_NOOP != '1'
        # R103: this stage runs the whole AI desk. It has taken 18-25 minutes; a 60-minute
        # ceiling means a hang reports itself as a dead step (and the next scheduled run is
        # a clean retry) instead of eating the job's 100-minute budget mid-way.
        timeout-minutes: 60
        env:
          ASHNA_KEY: ${{ secrets.ASHNA_KEY }}
          # OWNER ORDER 2026-11-14: one pinned model for every AI step in this job.
          # gpt-6.1-sol is the "6.1" high-reasoning/low-price route; gpt-6-astra is the
          # one that emptied the balance. Pinned here so no script default can reach for
          # the expensive model, and mirrored in each script's own default.
          ASHNA_MODEL: gpt-6.1-sol
          BIAS_MODEL: gpt-6.1-sol
          CI_KEY: ${{ secrets.CI_KEY }}
          TD_KEY: ${{ secrets.TD_KEY }}
          LSE_API_KEY: ${{ secrets.LSE_API_KEY || secrets.LSE }}
          OM_MCP_TOKEN: ${{ secrets.OM_MCP_TOKEN }}
          OM_MCP_TOKEN_2: ${{ secrets.OM_MCP_TOKEN_2 }}
          # R100: an explicit rebuild from the Run-workflow form lifts the "the candle is
          # still trading" refusal ONLY when the desk is already on the last closed candle,
          # so a wording/annotation fix can reach today's cards without waiting for tonight.
          XEF_FORCE_REBUILD: ${{ inputs.rebuild == 'yes' && '1' || '' }}
        run: |
          cd /home/user
          # A scheduled run has no `inputs.cycle`, so route it from the cron expression.
          # Without this the case statement would fall through to *) and run nothing.
          CYCLE="${{ inputs.cycle }}"
          if [ -z "$CYCLE" ]; then
            case "${{ github.event.schedule }}" in
              "20 0 * * 2-6") CYCLE=miss-review ;;
              "0 12 * * 2-6") CYCLE=position-check ;;
              # R99 daily desk: the 22:30Z run plus the two morning catch-ups. The old
              # 21:00Z/22:00Z spellings stay mapped so a run already queued against the
              # previous schedule still resolves to the desk instead of silently falling
              # through to deploy-only (which is what happened on 19 Nov).
              "30 22 * * *"|"20 5 * * *"|"20 9 * * *"|"40 23 * * *"|"40 2 * * *"|"0 21 * * *"|"0 22 * * *"|"0 21 * * 1-5"|"0 22 * * 1-5") CYCLE=daily-bias ;;
              *) CYCLE=deploy-only ;;
            esac
          fi
          echo "cycle resolved: $CYCLE (trigger: ${{ github.event_name }} ${{ github.event.schedule }})"
          case "$CYCLE" in
            position-check)
              if [ -z "${{ inputs.setup }}" ] || [ -z "${{ inputs.entry }}" ] || [ -z "${{ inputs.sl }}" ] || [ -z "${{ inputs.tp }}" ]; then
                echo "::error::position-check needs YOUR fill — fill the setup / entry / sl / tp fields in the Run-workflow form"
                exit 1
              fi
              FILLED=""
              [ -n "${{ inputs.filled }}" ] && FILLED="--filled ${{ inputs.filled }}"
              python3 fetch-position.py
              python3 build-position-request.py --setup "${{ inputs.setup }}" --entry "${{ inputs.entry }}" --sl "${{ inputs.sl }}" --tp "${{ inputs.tp }}" $FILLED
              python3 call-position-check.py
              python3 publish-position-check.py
              ;;
            sniper-refresh)
              python3 fetch-refresh.py
              python3 om-oi-grade.py || echo "::warning::OI shadow grading skipped (non-fatal)"
              python3 om-oi-shadow.py || echo "::warning::OI shadow fetch skipped (non-fatal)"
              python3 build-sniper-request.py
              ASHNA_MODEL=gpt-6.1-sol python3 call-omni-sniper.py
              if ! python3 publish-sniper.py; then
                echo "::warning::sniper validation rejected the response - ONE corrective retry (the exact failures are fed back to the model)"
                if ! { python3 build-sniper-request.py && ASHNA_MODEL=gpt-6.1-sol python3 call-omni-sniper.py && python3 publish-sniper.py; }; then
                  echo "::error::sniper-refresh published NOTHING - the previous payload is still live. Re-run the cycle."
                  exit 1
                fi
              fi
              python3 execution-sheet.py || echo "::warning::execution sheet skipped (non-fatal)"
              ;;
            daily-bias)
              # ── OWNER ORDER 2026-11-14 ───────────────────────────────────────────────
              # "when I run daily biais, it should run all fresh fetchings and AI calls on
              # all pages, one by one ... setups sniper, then AI fondamental verdict ...
              # all pages that contain AI should run fresh renders."
              #
              # This branch is now the WHOLE DESK, in order:
              #   lessons -> fetch-bias -> AI bias -> publish
              #           -> fetch-refresh -> AI setups/sniper -> publish -> execution sheet
              # and then the workflow steps that follow this one do the rest:
              #   every page dataset + AI FUNDAMENTAL VERDICT -> bias-v2 -> deploy -> verify.
              #
              # It is a script, not more YAML, because Actions runs each run: block with
              # `bash -e`: a single failure used to kill every stage after it. Each stage is
              # isolated now, so one gate rejection cannot stop the rest of the desk from
              # refreshing. The script exits 0 on purpose — deploy must still happen — and
              # the "Report the full chain" step at the end fails the run honestly if a
              # critical AI stage did not produce a fresh page.
              echo "::notice::FULL CHAIN — bias, setups, every page dataset, then deploy"
              bash /home/user/run-full-chain.sh
              ;;
            bias-only)
              # The narrow, cheaper path: only the AI Daily Bias card is refreshed. Kept
              # so a re-run after a single gate rejection does not pay for the whole desk.
              echo "::notice::bias-only — the AI Daily Bias card and nothing else"
              CLOSED=$(python3 check-fresh-lessons.py --resolve-only || echo "unknown")
              echo "last closed candle: $CLOSED (review-only, no rule is added)"
              python3 fetch-bias.py
              python3 om-oi-grade.py || echo "::warning::OI shadow grading skipped (non-fatal)"
              python3 om-oi-shadow.py || echo "::warning::OI shadow fetch skipped (non-fatal)"
              python3 build-bias-request.py
              BIAS_MODEL=gpt-6.1-sol python3 call-bias.py
              python3 publish-bias.py || {
                echo "::warning::publish gates rejected the forecast - ONE corrective retry"
                python3 build-bias-request.py && python3 call-bias.py && python3 publish-bias.py
              }
              ;;
            miss-review)
              # v1 ROLLBACK: this cycle used to append a rule after every miss. It now writes the
              # forensic review only — publish-miss-review.py refuses to touch the rule set while
              # the v1 lock is present in learning-state.json.
              CLOSED=$(python3 check-fresh-lessons.py --resolve-only)
              echo "miss-review (forensic only, NO rule append) for $CLOSED"
              python3 fetch-miss-review.py --date "$CLOSED" || echo "::warning::fetch failed (non-fatal)"
              ;;
            deploy-only)
              echo "deploy-only: no AI run — deploying the current repo state to both sites"
              ;;
          esac

      - name: Refresh every page dataset (COT, seasonality, FX strength, macro, verdicts)
        if: env.XEF_NOOP != '1'
        timeout-minutes: 30
        env:
          # OWNER ORDER 2026-11-14: the Fundamental page's AI verdict is a real model call
          # on gpt-6.1-sol, not the deterministic scorer. One call judges every economy, so
          # the cost is a few thousand tokens per run, not a call per asset.
          ASHNA_KEY: ${{ secrets.ASHNA_KEY }}
          ASHNA_MODEL: gpt-6.1-sol
          FONDA_EFFORT: high
          # "all pages that contain AI should run fresh renders": rebuild every instrument's
          # chart series on a full-desk run, not just gold.
          XEF_CHART_ALL: ${{ (inputs.cycle == 'daily-bias' || github.event_name == 'schedule') && '1' || '' }}
        run: |
          # COT / seasonality / FX strength / macro are cheap fetches; the verdicts stage makes
          # ONE model call and falls back to the deterministic scorer if that call fails.
          # Never fatal — the bias cycle above is the main work.
          python3 /home/user/refresh-page-data.py --allow-partial || echo "::warning::page refresh had failures (see log)"          # R108 — the archive's reads are refreshed by step "15b" inside run-full-chain.sh,
          # BEFORE the packs consume them. Nothing is fetched twice here.

      - name: BIAS-V2 — standalone daily bias + setups page
        if: env.XEF_NOOP != '1'
        # OWNER REQUEST 2026-11-06: a second, independent page at /bias-v2.html.
        # Its own folder (/home/user/bias-v2), its own data, its own output.
        # It never reads or writes the AI Daily Bias / AI Setups / sniper artefacts,
        # so it cannot disturb them. No model calls -> no token cost.
        # Non-fatal on purpose: if a public feed is rate-limited we keep the previous
        # page rather than shipping a broken one, and the main cycle still deploys.
        env:
          # spot XAU/USD comes from TwelveData. Without this the page silently falls back to
          # GC=F futures, which trades at a basis (~$43 on 2026-11-06) and would publish
          # every level ~$43 above the owner's spot chart.
          TD_KEY: ${{ secrets.TD_KEY }}
        run: bash /home/user/bias-v2/run.sh || echo "::warning::bias-v2 refresh failed — previous page stays live"

      - name: Deploy both sites to Surge
        if: env.XEF_NOOP != '1'
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: bash /home/user/deploy-sites.sh

      - name: Verify live after deploy (the desk customers read must be this session's)
        if: env.XEF_NOOP != '1'
        # "HTTP 200" only proves a site is up — that is how a three-day-old desk passed
        # every check. Both domains must now serve a desk anchored on the last CLOSED
        # candle, and bias-all.json / sniper index must come from this session.
        run: |
          sleep 5
          for h in https://xau-elite-fx.surge.sh https://xau-elite-fx2.surge.sh; do
            curl -fsS -o /dev/null -w "$h /home : %{http_code}\n" "$h/"
            curl -fsS -o /dev/null -w "$h chartdata : %{http_code}\n" "$h/chartdata/chart-XAUUSD-1D.json"
            python3 /home/user/desk_fresh.py --host "$h" || {
              echo "::error::$h is not serving a desk anchored on the last closed candle"; exit 1; }
          done
          python3 - <<'EOF'
          import json, urllib.request, datetime, sys
          now = datetime.datetime.now(datetime.timezone.utc)
          bad = 0
          for host in ("https://xau-elite-fx.surge.sh", "https://xau-elite-fx2.surge.sh"):
              for path in ("/bias-all.json", "/sniper/index.json"):
                  try:
                      raw = urllib.request.urlopen(host + path + "?cb=" + str(now.timestamp()), timeout=30).read()
                      g = json.loads(raw).get("generatedAt")
                      age = (now - datetime.datetime.fromisoformat(str(g).replace("Z", "+00:00"))).total_seconds() / 3600.0
                      if age <= 14:
                          print("OK   %s%s - generatedAt %s (%.1f h)" % (host, path, g, age))
                      else:
                          print("::error::%s%s - generatedAt %s (%.1f h) IS NOT THIS SESSION'S" % (host, path, g, age))
                          bad += 1
                  except Exception as e:
                      print("::error::%s%s unreachable (%s)" % (host, path, e)); bad += 1
          print("live desk check: %d problem(s)" % bad)
          sys.exit(1 if bad else 0)
          EOF

      - name: Report the full chain (and fail the run if a page did not refresh)
        # HONESTY STEP. The chain script exits 0 so that deploy always happens with whatever
        # fresh data was produced; this is where the run is judged. It checks the PRODUCTS,
        # not the exit codes: a page counts as refreshed only if its published artefact was
        # written by THIS run. A corrective retry that worked reads green; a stage that
        # quietly published nothing does not.
        if: always() && env.XEF_NOOP != '1'
        run: |
          echo "──────── AI stage ledger ────────"
          if [ -f /tmp/xef-cycle-status.tsv ]; then
            printf '%-4s %-44s %-8s %s\n' ID STAGE STATUS TIME
            awk -F'\t' '{printf "%-4s %-44s %-8s %ss %s\n", $1, $2, $3, $4, $5}' /tmp/xef-cycle-status.tsv
          else
            echo "(no ledger — the chain script did not run for this cycle)"
          fi

          echo "──────── published artefacts written by this run ────────"
          BAD=0
          # deploy-only genuinely does not rebuild the desk: it ships the tree the last
          # real cycle produced. Gating it on "content changed" would fail every
          # deploy-only run (it did, 43944836288) and train us to ignore a red run. For
          # that cycle the artefacts must be PRESENT and parseable, nothing more.
          if [ "${{ inputs.cycle }}" = "deploy-only" ]; then
            echo "  note  cycle=deploy-only — freshness gated on presence, not on change"
            CYCLE_IS_DEPLOY_ONLY=1
          else
            CYCLE_IS_DEPLOY_ONLY=0
          fi
          check_fresh () {   # check_fresh <label> <path>
            label="$1"; path="$2"
            if [ ! -f "$path" ]; then
              echo "::error::$label — MISSING ($path)"; BAD=1; return
            fi
            if [ "$CYCLE_IS_DEPLOY_ONLY" = "1" ]; then
              echo "  OK   $label — present ($(stat -c %y "$path" | cut -d. -f1))"; return
            fi
            key=$(echo "$path" | sed 's|/home/user/||; s|/public/|-|' | tr '/' '-')
            base="/tmp/xefpre/${key}.sha"
            cur=$(sha256sum "$path" | cut -d' ' -f1)
            if [ ! -f "$base" ]; then
              echo "  OK   $label — created by this run (no previous copy)"
            elif [ "$cur" = "$(cut -d' ' -f1 "$base")" ]; then
              echo "::error::$label — NOT REFRESHED, byte-identical to the checkout"; BAD=1
            else
              echo "  OK   $label — content changed in this run"
            fi
          }
          # ROUND 23 — THE RED LIGHT MUST MEAN THE PRODUCT IS STALE.
          # daily-bias-locked.js and setups-preloaded.js are the SUPERSEDED v1 path.
          # Since round 21 the customer-facing desk is bias-all.json + bias/<SYM>.json,
          # produced by refresh-data.yml (every 3 h). Holding this workflow red for a v1
          # artefact that no page reads would train us to ignore a red run — so the v1
          # cards are reported, not gated, and the run fails only on the live desk.
          echo "-- v1 legacy artefacts (reported, not gated - superseded by bias-all.json) --"
          for f in daily-bias-locked.js setups-preloaded.js; do
            if [ -f "/home/user/xau-elite-fonda/public/$f" ]; then
              echo "  note  v1 $f present (not the desk source of truth)"
            else
              echo "  note  v1 $f absent"
            fi
          done
          echo "-- LIVE DESK (this is what customers read - gated on the DATE) --"
          # R99 — BYTE-IDENTITY IS NOT FRESHNESS. It caught a stage that did nothing, but it
          # cannot tell "nothing ran" from "a new timestamp on yesterday's analysis", and it
          # never asked the only question the owner asks: is this TODAY'S desk? The check is
          # now the same one the gate uses, run against the tree that is about to ship.
          if [ "$CYCLE_IS_DEPLOY_ONLY" = "1" ]; then
            echo "  note  cycle=deploy-only — freshness gated on presence, not on the date"
          else
            python3 - <<'EOF' || BAD=1
          import json, datetime, sys
          now = datetime.datetime.now(datetime.timezone.utc)
          bad = 0
          for label, path, key in [
              ("Multi-asset desk index", "/home/user/xau-elite-fonda/public/bias-all.json", "generatedAt"),
              ("Per-symbol desk XAUUSD", "/home/user/xau-elite-fonda/public/bias/XAUUSD.json", "generatedAt"),
          ]:
              try:
                  d = json.load(open(path))
              except Exception as e:
                  print("::error::%s — unreadable (%s)" % (label, e)); bad = 1; continue
              g = d.get(key)
              if not g:
                  print("::error::%s — no %s, cannot prove it is this session's" % (label, key)); bad = 1; continue
              age = (now - datetime.datetime.fromisoformat(g.replace("Z", "+00:00"))).total_seconds() / 3600.0
              bar = d.get("barAsOf") or ""
              ok = age <= 14
              print("%s%s — %s (%.1f h old)%s" % ("  OK   " if ok else "::error::", label, g, age,
                                                  "" if ok else "  <-- NOT THIS SESSION'S"))
              bad += 0 if ok else 1
          # and the card must be anchored on the last CLOSED candle, not the live one
          try:
              import glob
              card = json.load(open("/home/user/xau-elite-fonda/public/bias/XAUUSD.json"))
              bars = json.load(open("/home/user/xau-elite-fonda/public/chartdata/chart-XAUUSD-1D.json"))["data"]["bars"]
              # R103f — ASK THE DESK'S OWN RULE, not a third copy of it.
              # This used to settle the bar with a bare "+24h" clock while the builder
              # settles it with the instrument's own session evidence, so the verifier
              # declared a correct desk wrong: at 23:40Z gold's 19 Nov bar (which closed at
              # 22:00Z) had not been open 24 hours, so this said "last closed = 18 Nov" and
              # failed the run - after a perfectly good deploy.
              import sys
              sys.path.insert(0, "/home/user")
              from refresh import common as _C
              try:
                  _h1 = json.load(open("/home/user/xau-elite-fonda/public/chartdata/chart-XAUUSD-1H.json"))["data"]["bars"]
              except Exception:
                  _h1 = []
              _closed, _info = _C.drop_open_bars(bars, "1D", market_idle=_C.market_idle(_h1),
                                                 intraday_tail=_h1)
              closed = _closed[-1].get("date") if _closed else None
              if closed and card.get("barAsOf") != closed:
                  print("::error::the desk is anchored on %s but the last CLOSED candle is %s"
                        % (card.get("barAsOf"), closed)); bad = 1
              else:
                  print("  OK   desk anchored on the last closed candle (%s)" % card.get("barAsOf"))
          except Exception as e:
              print("::error::could not verify the anchor (%s)" % e); bad = 1
          raise SystemExit(bad)
          EOF
          fi
          # the same question, asked of the tree that is about to ship (file:// so the
          # gate and the deploy can never disagree about what "fresh" means)
          python3 /home/user/desk_fresh.py --host "file:///home/user/xau-elite-fonda/public" || BAD=1
          # R105: the two load-time defects a customer sees were both found on a phone,
          # not by a check. This one runs on every build from now on.
          python3 /home/user/test-live-ux.py || BAD=1
          check_fresh "Fundamental AI verdict" /home/user/xau-elite-fonda/public/fundamental-verdicts.json
          check_fresh "COT bundle"             /home/user/xau-elite-fonda/public/cot-5yr-all.js
          check_fresh "Macro bundle"           /home/user/xau-elite-fonda/public/macro-history.json

          echo "-- SNIPER SETUPS — one call per pair, for THIS session --"
          python3 - <<'EOF' || BAD=1
          import json
          d = json.load(open('/home/user/xau-elite-fonda/public/sniper/index.json'))
          ins = d.get('instruments') or {}
          judged = [k for k, v in ins.items()
                    if v.get('engine') == 'xef-desk-sniper' and (v.get('setups') or 0) > 0]
          fallback = [k for k, v in ins.items() if v.get('engine') == 'desk-rule-fallback']
          print('   generatedAt %s · %d judged · %d desk-rule fallbacks · %d instrument files'
                % (d.get('generatedAt'), len(judged), len(fallback), len(ins)))
          if fallback:
              print('   fallbacks: %s' % ', '.join(sorted(fallback)))
          unavailable = d.get('modelUnavailable') or []
          if len(judged) < 30:
              if unavailable:
                  # R101: an exhausted model balance is not a quiet desk. Fail, and say what
                  # it is, so nobody reads 27 fallback cards as 27 model rejections.
                  print('::error::the desk model account refused %d instrument(s) (%s) - '
                        '%d of %d carry the day\'s own setups. Read the provider\'s own words '
                        'in the log: "$0.75 and Rs.31, but Rs.31 is temporarily reserved" means '
                        'the balance is HELD, not empty - every call reserves the whole balance, '
                        'so a funded account can refuse every call at once. Top the balance up '
                        'to comfortably cover one run and the reserve stops binding.'
                        % (len(unavailable), ', '.join(unavailable[:10]), len(judged), len(ins)))
              raise SystemExit('::error::only %d of %d instruments carry the day\'s own setups'
                               % (len(judged), len(ins)))
          EOF

          echo "──────── AI route actually used ────────"
          python3 report-chain.py

          if [ "$BAD" -ne 0 ]; then
            echo "::error::a LIVE DESK artefact did not refresh in this run — see STALE/MISSING above. Customers would read the previous session's desk."
            exit 1
          fi
          echo "all AI pages refreshed in this run."

      - name: Commit the day's updated state back
        # ALWAYS: run 41747392727 passed lessons (VALIDATION: PASS, 6,257 content chars)
        # and then died at call-bias with HTTP 402. Because this step only ran on the
        # success path, the lessons were lost and learning-state.json stayed at
        # 2026-10-23 - so the next run would pay to recompute them. State that has
        # already been validated must be persisted even when a LATER step fails.
        if: always() && env.XEF_NOOP != '1'
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name  "xef-cycle-bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "cycle: ${{ inputs.cycle }} $(date -u +%F_%H%M)Z" || echo "nothing to commit"
          # R100: a push can lose a race with another commit (the deploy commit, or a fix
          # landed while this run was in flight). Failing the run AFTER the site has been
          # deployed and verified says "the site is broken" when it is not - it only means
          # the state file came back late. Rebase once and retry before giving up.
          for attempt in 1 2 3; do
            git push && { echo "state pushed (attempt $attempt)"; break; }
            echo "::warning::push rejected (attempt $attempt) - rebasing onto the remote and retrying"
            git pull --rebase --autostash origin main || true
          done
