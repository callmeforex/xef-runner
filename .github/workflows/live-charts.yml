name: XAU ELITE FX — Live Gold Bars (every 20m, TradingView, $0 AI)

# Keeps XAUUSD's 8 timeframes (1m/5m/15m/30m/1H/4H/1D/1W) within ~20 minutes of the live
# TradingView OANDA:XAUUSD feed. One symbol = 8 websocket sessions (~5 s), no model calls,
# no API keys, and on Saturday the market is closed so the job exits in 1 s.
# Also checks desk_fresh.py after updating gold bars and auto-dispatches daily-cycles.yml
# (workflow_dispatch starts in ~2s, bypassing GitHub schedule cron delays) whenever the
# published desk is behind the last closed daily candle.

on:
  schedule:
    - cron: '*/20 * * * 0-5'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: xef-deploy
  cancel-in-progress: false

jobs:
  gold-bars:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch' || github.event.schedule != ''
    steps:
      - name: Skip while the market is closed (Saturday in UTC)
        id: gate
        run: |
          DOW=$(date -u '+%u')
          HR=$(date -u '+%H')
          if [ "$DOW" = "6" ] || { [ "$DOW" = "7" ] && [ "$HR" -lt 22 ]; } || { [ "$DOW" = "5" ] && [ "$HR" -ge 23 ]; }; then
            if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
              echo "FX/metals weekend break (UTC dow=$DOW hr=$HR) — nothing new prints"
              echo "skip=1" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "skip=0" >> "$GITHUB_OUTPUT"

      - name: Checkout private repo
        if: steps.gate.outputs.skip != '1'
        uses: actions/checkout@v4
        with:
          repository: callmeforex/xau-elite-fx
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      - name: Map /home/user
        if: steps.gate.outputs.skip != '1'
        run: sudo ln -sfn "$GITHUB_WORKSPACE" /home/user

      - name: Install websocket-client
        if: steps.gate.outputs.skip != '1'
        run: python3 -m pip install --quiet --disable-pip-version-check websocket-client requests

      - name: Pull XAUUSD 8 timeframes from TradingView
        if: steps.gate.outputs.skip != '1'
        run: |
          cd /home/user
          python3 - <<'EOF'
          from refresh import charts, common as C
          r = charts.run(scope='gold')
          C.log('live-charts: %s' % r)
          EOF

      - name: Deploy both sites to Surge
        if: steps.gate.outputs.skip != '1'
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
          XEF_KEEP_BUILD_STAMP: '1'
        run: bash /home/user/deploy-sites.sh

      - name: Commit updated gold bars
        if: steps.gate.outputs.skip != '1'
        run: |
          cd /home/user
          git config user.name  "xef-data-bot"
          git config user.email "xef-data-bot@users.noreply.github.com"
          git add chartdata-master/chart-XAUUSD-*.json \
                  xau-elite-fonda/public/chartdata/chart-XAUUSD-*.json \
                  xau-elite-fonda2/public/chartdata/chart-XAUUSD-*.json
          git diff --cached --quiet && exit 0
          git commit -m "charts: XAUUSD $(date -u '+%Y-%m-%d %H:%M UTC')"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && break
            sleep 2
          done

      - name: Auto-dispatch Daily Cycle when Desk is Behind Last Closed Candle
        if: steps.gate.outputs.skip != '1'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_TOKEN_FALLBACK: ${{ github.token }}
        run: |
          if [ "$(TZ=Africa/Casablanca date '+%u')" = "6" ]; then
            echo "Saturday in Casablanca — market closed, skipping daily-cycles check"
            exit 0
          fi
          set +e
          OUT=$(python3 /home/user/desk_fresh.py)
          RC=$?
          set -e
          echo "desk_fresh after gold-bars update: $OUT (exit $RC)"
          if [ "$RC" -eq 0 ]; then
            echo "Desk is FRESH — no daily-cycles dispatch needed."
            exit 0
          fi
          echo "::notice::Desk is BEHIND ($OUT) — checking if daily-cycles.yml is already running on callmeforex/xef-runner..."
          python3 - <<'PY'
          import json, os, urllib.request
          tok = os.environ.get("GH_PAT") or os.environ.get("GH_TOKEN_FALLBACK") or ""
          if not tok:
              print("no token available for workflow dispatch")
              raise SystemExit(0)
          headers = {
              "Authorization": f"Bearer {tok}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "xef-auto-dispatcher",
          }
          runs_url = "https://api.github.com/repos/callmeforex/xef-runner/actions/workflows/daily-cycles.yml/runs?per_page=5"
          try:
              req = urllib.request.Request(runs_url, headers=headers)
              runs = json.loads(urllib.request.urlopen(req, timeout=15).read()).get("workflow_runs", [])
              active = [r for r in runs if r.get("status") in ("in_progress", "queued", "waiting", "requested", "pending")]
              if active:
                  print(f"daily-cycles.yml already active/queued (run {active[0].get('id')} status={active[0].get('status')}) — skipping duplicate dispatch")
                  raise SystemExit(0)
          except SystemExit:
              raise
          except Exception as e:
              print(f"warning: could not check active runs ({e})")
          disp_url = "https://api.github.com/repos/callmeforex/xef-runner/actions/workflows/daily-cycles.yml/dispatches"
          body = json.dumps({"ref": "main", "inputs": {"cycle": "daily-bias", "rebuild": "if-behind"}}).encode()
          try:
              req = urllib.request.Request(disp_url, data=body, headers={**headers, "Content-Type": "application/json"}, method="POST")
              with urllib.request.urlopen(req, timeout=15) as r:
                  print(f"Successfully dispatched daily-cycles.yml on callmeforex/xef-runner (HTTP {r.status})")
          except Exception as e:
              print(f"warning: could not dispatch daily-cycles.yml ({e})")
          PY
