name: XAU ELITE FX — Refresh All Page Data (COT · Seasonality · Verdicts · Curves · 8-TF Charts)

on:
  schedule:
    - cron: '7 */1 * * *'
  workflow_dispatch:
    inputs:
      allow_partial:
        description: 'Deploy whatever succeeded even if one upstream is down'
        required: false
        default: 'true'
        type: choice
        options: ['false', 'true']
      rebuild_bias:
        description: 'Force a full 34-pair daily-bias rebuild regardless of barAsOf'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write
  actions: write

concurrency:
  group: xef-deploy
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: callmeforex/xau-elite-fx
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      - name: Map /home/user to the repo
        run: sudo ln -sfn "$GITHUB_WORKSPACE" /home/user

      - name: Install Python dependencies
        run: |
          python3 -m pip install --quiet --disable-pip-version-check -r requirements.txt
          python3 -c "import requests, bs4, websocket; print('deps ok — websocket', websocket.__version__)"

      - name: Cost guard — skip if live data is already fresh AND desk is not behind
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "manual dispatch — running regardless of age"
            echo "SKIP_REFRESH=0" >> "$GITHUB_ENV"
            exit 0
          fi
          set +e
          DF_OUT=$(python3 /home/user/desk_fresh.py)
          DF_RC=$?
          set -e
          echo "desk_fresh: $DF_OUT (exit $DF_RC)"
          if [ "$DF_RC" -ne 0 ]; then
            echo "::notice::desk is BEHIND ($DF_OUT) — bypassing cost guard to refresh immediately"
            echo "SKIP_REFRESH=0" >> "$GITHUB_ENV"
            exit 0
          fi
          AGE=$(python3 - <<'PY'
          import datetime as dt, json, urllib.request
          try:
              url = f"https://xau-elite-fx.surge.sh/data-freshness.json?cb={int(dt.datetime.now().timestamp())}"
              raw = urllib.request.urlopen(url, timeout=15).read()
              g = json.loads(raw).get("generatedAt", "")
              t = dt.datetime.fromisoformat(g.replace("Z", "+00:00"))
              print(int((dt.datetime.now(dt.timezone.utc) - t).total_seconds() // 60))
          except Exception:
              print(9999)
          PY
          )
          echo "live data-freshness.json age: ${AGE} min"
          if [ "$AGE" -lt 50 ]; then
            echo "::notice::live data is ${AGE} min old (< 50 min) and desk is FRESH — skipping this scheduled run"
            echo "SKIP_REFRESH=1" >> "$GITHUB_ENV"
          else
            echo "SKIP_REFRESH=0" >> "$GITHUB_ENV"
          fi

      - name: Unpack archives (first run only — later runs use the committed trees)
        if: env.SKIP_REFRESH != '1'
        run: |
          cd /home/user
          for z in sites.zip chartdata-master.zip; do
            if [ -f "$z" ]; then unzip -q "$z" && rm -f "$z" && echo "unpacked $z"; fi
          done
          ls -la /home/user/xau-elite-fonda/public | head -12

      - name: Refresh every page dataset from its real source
        if: env.SKIP_REFRESH != '1'
        env:
          ASHNA_KEY: ${{ secrets.ASHNA_KEY }}
          CI_KEY: ${{ secrets.CI_KEY }}
          ASHNA_MODEL: gpt-6.1-sol
          FONDA_EFFORT: high
          XEF_CHART_ALL: '1'
          LSE_API_KEY: ${{ secrets.LSE_API_KEY || secrets.LSE }}
          OM_MCP_TOKEN: ${{ secrets.OM_MCP_TOKEN }}
          OM_MCP_TOKEN_2: ${{ secrets.OM_MCP_TOKEN_2 }}
        run: |
          cd /home/user
          FLAGS="--allow-partial"
          if [ "${{ inputs.allow_partial }}" = "false" ]; then FLAGS=""; fi
          python3 refresh-page-data.py $FLAGS

      - name: Rebuild macro history from freshly updated terminal-data.js
        if: env.SKIP_REFRESH != '1'
        run: |
          cd /home/user
          node build-macro-history.js || echo "::warning::build-macro-history failed — keeping existing macro-history.json"

      - name: Which instruments' daily bias is behind their own last closed candle?
        if: env.SKIP_REFRESH != '1'
        id: bias_gate
        run: |
          cd /home/user
          if [ "${{ inputs.rebuild_bias }}" = "true" ]; then
            echo "::notice::rebuild_bias=true — rebuilding all 34 daily-bias cards"
            echo "STALE_SYMS=ALL" >> "$GITHUB_ENV"
            exit 0
          fi
          SYMS=$(python3 -m refresh.bar_close --stale-symbols | tail -1)
          echo "STALE_SYMS=$SYMS" >> "$GITHUB_ENV"
          if [ -z "$SYMS" ]; then
            echo "::notice::all 34 daily-bias cards are already anchored on their own last closed candle"
          else
            echo "::notice::rebuilding daily bias for stale instruments: $SYMS"
          fi

      - name: AI preflight — model endpoint + credit check
        if: env.SKIP_REFRESH != '1' && env.STALE_SYMS != ''
        id: ai_ok
        continue-on-error: true
        env:
          ASHNA_KEY: ${{ secrets.ASHNA_KEY }}
          CI_KEY: ${{ secrets.CI_KEY }}
        run: |
          cd /home/user
          if python3 -m refresh.ai_preflight --require-credit; then
            echo "AI_READY=1" >> "$GITHUB_ENV"
          else
            echo "::warning::AI gateway preflight failed — keeping the existing daily-bias cards and still deploying the fresh non-AI data"
            echo "AI_READY=0" >> "$GITHUB_ENV"
          fi

      - name: Pairs — daily bias for all 34 instruments (per-symbol evidence + AI)
        if: env.SKIP_REFRESH != '1' && env.STALE_SYMS != '' && env.AI_READY == '1'
        timeout-minutes: 25
        continue-on-error: true
        env:
          ASHNA_KEY: ${{ secrets.ASHNA_KEY }}
          CI_KEY: ${{ secrets.CI_KEY }}
          GOLD_MODEL: ampersand-v0.1
          PAIR_MODEL: glm-5.3-flash
          GOLD_EFFORT: high
          PAIR_EFFORT: medium
          BIAS_WORKERS: '3'
        run: |
          cd /home/user
          if [ "$STALE_SYMS" = "ALL" ]; then
            python3 -m refresh.bias_all
          else
            python3 -m refresh.bias_all --symbols "$STALE_SYMS"
          fi

      - name: Deploy both sites to Surge
        if: env.SKIP_REFRESH != '1'
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: bash /home/user/deploy-sites.sh

      - name: Verify live sites are serving this run's data
        if: env.SKIP_REFRESH != '1'
        run: |
          sleep 6
          python3 /home/user/verify-page-data.py

      - name: Snapshot the refreshed data into the repo
        if: env.SKIP_REFRESH != '1'
        run: |
          cd /home/user
          git config user.name  "xef-data-bot"
          git config user.email "xef-data-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "data: refresh $(date -u '+%Y-%m-%d %H:%M UTC')"
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin main && git push origin main && break
              echo "push collided with another commit (attempt $attempt) — rebasing"
              sleep 3
            done
          fi

      - name: Auto-dispatch full Daily Cycle if desk setups/locked bias still behind
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_TOKEN_FALLBACK: ${{ github.token }}
        run: |
          if [ "$(TZ=Africa/Casablanca date '+%u')" = "6" ]; then
            echo "Saturday in Casablanca — skipping daily-cycles auto-dispatch"
            exit 0
          fi
          set +e
          OUT=$(python3 /home/user/desk_fresh.py)
          RC=$?
          set -e
          echo "post-refresh desk_fresh: $OUT (exit $RC)"
          if [ "$RC" -eq 0 ]; then
            exit 0
          fi
          python3 - <<'PY'
          import json, os, urllib.request
          tok = os.environ.get("GH_PAT") or os.environ.get("GH_TOKEN_FALLBACK") or ""
          if not tok:
              print("no token for workflow dispatch")
              raise SystemExit(0)
          headers = {
              "Authorization": f"Bearer {tok}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "xef-auto-dispatcher",
          }
          runs_url = "https://api.github.com/repos/callmeforex/xef-runner/actions/workflows/daily-cycles.yml/runs?per_page=5"
          try:
              req = urllib.request.Request(runs_url, headers=headers)
              runs = json.loads(urllib.request.urlopen(req, timeout=15).read()).get("workflow_runs", [])
              active = [r for r in runs if r.get("status") in ("in_progress", "queued", "waiting", "requested", "pending")]
              if active:
                  print(f"daily-cycles.yml already active/queued (run {active[0].get('id')} status={active[0].get('status')}) — not dispatching duplicate")
                  raise SystemExit(0)
          except SystemExit:
              raise
          except Exception as e:
              print(f"warning: could not check active runs ({e})")
          disp_url = "https://api.github.com/repos/callmeforex/xef-runner/actions/workflows/daily-cycles.yml/dispatches"
          body = json.dumps({"ref": "main", "inputs": {"cycle": "daily-bias", "rebuild": "if-behind"}}).encode()
          try:
              req = urllib.request.Request(disp_url, data=body, headers={**headers, "Content-Type": "application/json"}, method="POST")
              with urllib.request.urlopen(req, timeout=15) as r:
                  print(f"dispatched daily-cycles.yml on callmeforex/xef-runner (HTTP {r.status})")
          except Exception as e:
              print(f"warning: could not dispatch daily-cycles.yml ({e})")
          PY
